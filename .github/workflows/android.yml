name: Android CI
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/xed.keystore
          else
            echo "No KEYSTORE secret, release APK will be debug-signed"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew assembleRelease && mv app/build/outputs/apk/release/*.apk "app/taskmanager-${COMMIT_HASH}.apk"
        env:
          KEYSTORE_FILE: /tmp/xed.keystore
          KEYSTORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.PASSWORD }}

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: TaskManager-Release
          path: app/taskmanager-${{ env.COMMIT_HASH }}.apk

      # Only properly signed builds are published, otherwise updates would fail to install
      - name: Publish release
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          TAG="v${VERSION}"
          ASSET="app/TaskManager-${TAG}.apk"
          cp "app/taskmanager-${COMMIT_HASH}.apk" "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "TaskManager ${TAG}" --generate-notes
          fi

      - name: Delete keystore
        if: always()
        run: rm -f /tmp/xed.keystore
