name: Android CI
on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Tags and publishes a GitHub release from Conventional Commits, bumps the version in app/build.gradle.kts
  release:
    name: Semantic Release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.sr.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - id: sr
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          before=$(git describe --tags --abbrev=0 2>/dev/null || true)
          npx -y -p semantic-release -p @semantic-release/exec -p @semantic-release/git semantic-release
          git fetch --tags -q
          after=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ "$before" != "$after" ]; then echo "tag=$after" >> "$GITHUB_OUTPUT"; fi

  build-release:
    name: Build Release
    needs: release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE != '' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/xed.keystore
          else
            echo "No KEYSTORE secret, release APK will be debug-signed"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set Commit Hash
        run: echo "COMMIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build with Gradle
        run: ./gradlew assembleRelease && mv app/build/outputs/apk/release/*.apk "app/taskmanager-${COMMIT_HASH}.apk"
        env:
          KEYSTORE_FILE: /tmp/xed.keystore
          KEYSTORE_PASSWORD: ${{ secrets.STOREPASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.PASSWORD }}

      - name: Archive APK
        uses: actions/upload-artifact@v7
        with:
          name: TaskManager-Release
          path: app/taskmanager-${{ env.COMMIT_HASH }}.apk

      # Only properly signed builds are attached, otherwise updates would fail to install
      - name: Attach APK to release
        if: ${{ needs.release.outputs.tag != '' && env.HAS_KEYSTORE == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          ASSET="app/TaskManager-${TAG}.apk"
          cp "app/taskmanager-${COMMIT_HASH}.apk" "$ASSET"
          gh release upload "$TAG" "$ASSET"

      - name: Delete keystore
        if: always()
        run: rm -f /tmp/xed.keystore
